[project]
name = "typesymbolic"
version = "0.1.0"
description = "Domain-agnostic neurosymbolic ODAV (observe/decide/act/verify) core: a typed-judge boundary, a gate, a journal, and calibration."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7,<1"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
